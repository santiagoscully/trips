<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Board</title>
<meta name="theme-color" content="#16202A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trips">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E8EDEA; --ink:#16202A; --muted:#5A6873; --line:#D3DBD6;
  --accent:#1D5BBF; --accent-ink:#FFFFFF; --accent-soft:#E2EBFA;
  --now:#A86A12; --now-soft:#FBF0DC; --good:#2E7A4D; --good-soft:#E0F1E6; --bad:#B23838; --bad-soft:#F8E3E1;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 6px 20px rgba(22,32,42,.06);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1317; --surface:#161E24; --surface-2:#1D272E; --ink:#E6ECE8; --muted:#94A3AC; --line:#2A363E;
    --accent:#76A5F2; --accent-ink:#0E1317; --accent-soft:#1B2A40;
    --now:#E4AE55; --now-soft:#2E2414; --good:#6CC28E; --good-soft:#15291D; --bad:#EC8A82; --bad-soft:#341A19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1317; --surface:#161E24; --surface-2:#1D272E; --ink:#E6ECE8; --muted:#94A3AC; --line:#2A363E;
  --accent:#76A5F2; --accent-ink:#0E1317; --accent-soft:#1B2A40;
  --now:#E4AE55; --now-soft:#2E2414; --good:#6CC28E; --good-soft:#15291D; --bad:#EC8A82; --bad-soft:#341A19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:max(14px,env(safe-area-inset-left,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:28px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:12px}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.who select{font:700 15px/1.2 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.who select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pax div.me b::after{content:" · " attr(data-me);color:var(--accent);font-weight:700}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px/1 var(--body);padding:10px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.copy:focus-visible,summary:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:grid;gap:20px;padding-top:20px}
.banner{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.banner.alert{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.banner strong{color:var(--ink)}
.eyebrow{font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.hero-head{padding:18px 20px 16px;background:var(--now-soft);border-bottom:1px solid var(--line);display:grid;gap:6px}
.hero-head .eyebrow{color:var(--now)}
.hero-head.calm{background:var(--surface-2)}
.hero-head.calm .eyebrow{color:var(--muted)}
.hero h2{font-family:var(--display);font-stretch:90%;font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.1;margin:0;text-wrap:balance}
.hero .sub{color:var(--muted);margin:0}
.hero-body{padding:16px 20px 20px;display:grid;gap:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 15px/1 var(--body);padding:12px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(.97)}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.quick .btn.mini{margin-top:0}
.btn.mini{padding:7px 10px;font-size:13px;margin-top:6px;color:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.04em}
.copy{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:700 12px/1 var(--body);padding:5px 8px;border-radius:6px;margin-left:8px;cursor:pointer;vertical-align:1px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.steps li b{display:block}
.note{font-size:14px;color:var(--muted);margin:0}
.flag{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--now-soft);font-size:14px}
.flag.ok{background:var(--good-soft)}
.flag::before{content:"!";flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--now);color:var(--surface);font:800 13px/1 var(--display)}
.flag.ok::before{content:"✓";background:var(--good)}
.section-title{font-family:var(--display);font-stretch:90%;font-weight:800;font-size:20px;margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.card h3{font-family:var(--display);font-stretch:92%;font-weight:700;font-size:19px;margin:0;text-wrap:balance}
.next{list-style:none;margin:0;padding:0;display:grid}
.next li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.next li:first-child{border-top:0}
.when{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* trips list */
.month{font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 -8px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trip>summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;gap:6px}
.trip>summary::-webkit-details-marker{display:none}
.chev{font-size:26px;line-height:1;color:var(--muted);transition:transform .15s}
.trip[open] .chev{transform:rotate(90deg)}
.trip-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.trip h3{font-family:var(--display);font-stretch:90%;font-weight:800;font-size:22px;margin:0;text-wrap:balance}
.dates{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:0}
.chip.fam{background:var(--accent-soft);color:var(--accent)}
.chip.soon{background:var(--now-soft);color:var(--now)}
.about summary{cursor:pointer;color:var(--muted);font-size:13px}
.about p{font-size:13px;color:var(--muted);margin:6px 0}
.ends{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ends b{font-family:var(--body);color:var(--ink);margin-right:4px}
.trip-body{padding:0 18px 18px;display:grid;gap:12px}
.seg{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid}
.seg-main{padding:14px 16px;display:grid;gap:8px}
.seg-type{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.seg h4{margin:0;font-family:var(--display);font-stretch:95%;font-weight:700;font-size:17px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.route .ap{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:34px;line-height:1;letter-spacing:.02em}
.route .t{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}
.route .mid{color:var(--muted);font-size:13px;text-align:center;padding-bottom:16px}
.route .r{text-align:right}
.route .tz{font-family:var(--body);font-size:12px}
.route .t b{color:var(--ink)}
.stub{border-top:2px dashed var(--line);padding:12px 16px;display:grid;gap:10px;background:var(--surface-2);border-radius:0 0 12px 12px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.stub::before{left:-9px}.stub::after{right:-9px}
.pax{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pax div{font-size:14px}
.pax .code{font-size:13px;color:var(--muted);display:block}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.preview{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.preview .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preview .chip{cursor:pointer}
.preview .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.preview input{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
footer{color:var(--muted);font-size:13px;padding-top:12px}
@media (max-width:480px){
  .route .ap{font-size:28px}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dt{margin-top:8px;font-size:13px}
  .next li{grid-template-columns:1fr;gap:2px}
  h1{font-size:24px}
  .trip>summary{padding:14px}
  .trip-body{padding:0 12px 14px}
  .trip h3{font-size:21px}
  .seg-main{padding:12px}
  .stub{padding:12px}
  .card{padding:14px}
  .hero-head{padding:16px}
  .hero-body{padding:14px 16px 16px}
  .btn{padding:11px 14px}
  .ends{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Trip Board</h1>
      <span class="clock" id="clock"></span>
    </div>
    <div class="who"><label for="person">Showing trips for</label><select id="person"></select></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-now" data-view="now" aria-selected="true">Now</button>
      <button class="tab" role="tab" id="tab-trips" data-view="trips" aria-selected="false">Upcoming</button>
      <button class="tab" role="tab" id="tab-past" data-view="past" aria-selected="false">Past</button>
    </nav>
  </header>
  <main id="app"><div class="empty">Loading trips…</div></main>
  <footer id="foot"><details class="about"><summary>About</summary>
    <p>Details come from booking emails. Flights and email are checked weekly, and every day from 2 days before a trip until it ends. <span id="about-checked"></span></p>
    <button class="copy" id="lock" hidden>Forget passphrase on this device</button></details></footer>
</div>

<script>
(() => {
const H = 3600e3, M = 60e3, D = 24 * H;
const AIRPORTS = {SJC:"San José",DEN:"Denver",SFO:"San Francisco",HNL:"Honolulu",TPA:"Tampa",LAS:"Las Vegas",ZRH:"Zurich",BCN:"Barcelona",LIN:"Milan Linate",PTY:"Panama City",COR:"Córdoba"};
let MAIN = "";
let HOME = null; // {address, airports: {SJC: minutes, ...}}
const driveMin = code => HOME?.airports?.[code];
const state = { trips: [], status: null, view: "now", override: null, loaded: false, error: null, person: "", locked: false, unlockError: "" };

try { const v = localStorage.getItem("tb-view"); if (v) state.view = v; } catch (e) {}

// ---------- people: anyone named on a booking in the trips ----------
const isPerson = n => typeof n === "string" && n.trim() && !/\d/.test(n);
function peopleOf(trip) {
  const names = new Set();
  [...(trip.travelers || []), ...(trip.companions || [])].forEach(n => isPerson(n) && names.add(n));
  trip.segments.forEach(s => (s.travelers || []).forEach(p => { const n = typeof p === "string" ? p : p.name; if (isPerson(n)) names.add(n); }));
  return names;
}
// A trip belongs to a person if they're on any reservation in it; the whole trip
// (including bookings under other names) is then shown to them.
const tripsFor = p => state.trips.filter(t => peopleOf(t).has(p));
function allPeople() {
  const all = new Set();
  state.trips.forEach(t => peopleOf(t).forEach(n => all.add(n)));
  const rest = [...all].filter(n => n !== MAIN).sort();
  return [MAIN, ...rest];
}
const h = (location.hash || "").slice(1); if (["now","trips","past"].includes(h)) state.view = h;

// ---------- time helpers: every ISO string carries its own local offset ----------
const ms = iso => Date.parse(iso);
const offMin = iso => { const m = /([+-])(\d\d):(\d\d)$/.exec(iso); return m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) : 0; };
function parts(t, off) { const d = new Date(t + off * M); return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay(), hh: d.getUTCHours(), mi: d.getUTCMinutes() }; }
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const tStr = p => `${(p.hh % 12) || 12}:${String(p.mi).padStart(2, "0")} ${p.hh < 12 ? "AM" : "PM"}`;
const dStr = p => `${WD[p.wd]}, ${MO[p.mo]} ${p.d}`;
// format an instant in the time zone of a reference ISO string
const timeAt = (t, ref) => tStr(parts(t, offMin(ref)));
const dateAt = (t, ref) => dStr(parts(t, offMin(ref)));
const when = (t, ref) => `${dateAt(t, ref)}, ${timeAt(t, ref)}`;
const T = iso => timeAt(ms(iso), iso), DT = iso => when(ms(iso), iso), DD = iso => dateAt(ms(iso), iso);
function rangeStr(a, b) {
  const pa = parts(ms(a), offMin(a)), pb = parts(ms(b), offMin(b));
  if (pa.y === pb.y && pa.mo === pb.mo && pa.d === pb.d) return `${MO[pa.mo]} ${pa.d}, ${pa.y}`;
  if (pa.y === pb.y) return `${MO[pa.mo]} ${pa.d} – ${MO[pb.mo]} ${pb.d}, ${pb.y}`;
  return `${MO[pa.mo]} ${pa.d}, ${pa.y} – ${MO[pb.mo]} ${pb.d}, ${pb.y}`;
}
function rel(dt) {
  const a = Math.abs(dt), s = dt >= 0 ? "in " : "", e = dt < 0 ? " ago" : "";
  if (a < 90 * M) return `${s}${Math.max(1, Math.round(a / M))} min${e}`;
  if (a < 36 * H) return `${s}${Math.round(a / H)} h${e}`;
  return `${s}${Math.round(a / D)} days${e}`;
}
const now = () => state.override ?? Date.now();

// ---------- small render helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const first = n => esc(String(n).split(" ")[0]);
// Open the airline/hotel/car app instead of its website when it's installed.
// Android: an intent: link launches the app (package names from each site's assetlinks.json / Play Store)
// and Chrome falls back to the website if the app isn't there. iPhone: plain https links already
// hand off to apps that claim them (United, Hilton...), so they stay as they are.
const APPS = [
  [/(^|\.)united\.com$/, "com.united.mobile.android"],
  [/(^|\.)(hgvc|hiltongrandvacations)\.com$/, "com.hilton.grandvacations"],
  [/(^|\.)hilton\.com$/, "com.hilton.android.hhonors"],
  [/(^|\.)avis\.com$/, "com.avis.androidapp"],
  [/(^|\.)southwest\.com$/, "com.southwestairlines.mobile"],
  [/(^|\.)swiss\.com$/, "com.yoc.swiss.swiss"],
  [/(^|\.)copaair\.com$/, "com.mttnow.android.copa.production"],
  [/(^|\.)easyjet\.com$/, "com.mttnow.droid.easyjet"],
  [/(^|\.)expedia\.com$/, "com.expedia.bookings"],
  [/(^|\.)europcar\.com$/, "com.clanmo.europcar"],
  [/(^|\.)hyatt\.com$/, "com.Hyatt.hyt"],
  [/(^|\.)marriott\.com$/, "com.marriott.mrt"],
  [/(^|\.)ihg\.com$/, "com.ihg.apps.android"],
];
const ANDROID = /Android/i.test(navigator.userAgent);
const appHref = u => {
  if (!ANDROID || !u) return u;
  let url; try { url = new URL(u); } catch (_) { return u; }
  const back = `S.browser_fallback_url=${encodeURIComponent(u)};end`;
  // Google Maps understands these links itself, so open the exact place/route in it
  if (/(^|\.)google\.com$/.test(url.hostname) && url.pathname.startsWith("/maps"))
    return `intent://${url.host}${url.pathname}${url.search}#Intent;scheme=https;package=com.google.android.apps.maps;${back}`;
  const app = APPS.find(([re]) => re.test(url.hostname));
  return app ? `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${app[1]};${back}` : u;
};
const hrefAttrs = u => { const h = appHref(u); return h === u ? `href="${esc(u)}" target="_blank" rel="noopener"` : `href="${esc(h)}"`; };
const link = (href, label, primary) => href ? `<a class="btn${primary ? " primary" : ""}" ${hrefAttrs(href)}>${esc(label)} ↗</a>` : "";
const copyBtn = v => `<button class="copy" data-copy="${esc(v)}">Copy</button>`;
const codeRow = (label, v) => v ? `<dt>${esc(label)}</dt><dd><span class="code">${esc(v)}</span>${copyBtn(v)}</dd>` : "";
const row = (label, v) => v ? `<dt>${esc(label)}</dt><dd>${v}</dd>` : "";
// The one link that takes you straight to checking in for a flight or hotel
const checkinLink = s => s.type === "flight" ? s.airline?.checkin : s.onlineCheckin?.url;
const quickBtn = s => { const u = checkinLink(s); return u ? `<a class="btn mini" ${hrefAttrs(u)}>Check in ↗</a>` : ""; };
const maps = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const directions = (o, d) => `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}`;
const status = f => `https://www.google.com/search?q=${encodeURIComponent(f.flightNumber.split(" ")[0] + " flight status")}`;
const apName = c => AIRPORTS[c] || c;
// Map/directions target: the flight's terminal when we know it ("SJC airport Terminal A"), else the airport
const apPlace = (code, term) => term && !/^main terminal/i.test(term) ? `${code} airport ${term.split(",")[0]}` : `${code} airport`;
const depPlace = f => apPlace(f.from, f.departure?.terminal);
const arrPlace = f => apPlace(f.to, f.arrival?.terminal);
// "Terminal A · Gate 12" (empty when nothing is known yet)
const termGate = o => [o?.terminal, o?.gate && `Gate ${o.gate}`].filter(Boolean).join(" · ");
const city = f => apName(f.to);
// "4:39 PM Denver time", plus the date when it lands on a different local day than it leaves
const arrives = f => `${T(f.end)} ${esc(city(f))} time${DD(f.end) !== DD(f.start) ? ` (${DD(f.end)})` : ""}`;

function paxList(list) {
  if (!list || !list.length) return "";
  return `<div class="pax">${list.map(p => `<div${p.name === state.person ? ` class="me" ` : ""}><b data-me="${p.name === MAIN ? "you" : "selected"}">${esc(p.name)}</b>${p.seat ? `<span class="code">Seat ${esc(p.seat)}</span>` : ""}${p.booking ? `<span class="code">Booking ${esc(p.booking)}</span>` : ""}</div>`).join("")}</div>`;
}
const notes = arr => (arr || []).map(n => `<p class="note">• ${esc(n)}</p>`).join("");

// ---------- the "smart" part: turn segments into time-windowed actions ----------
function actionsFor(trip) {
  const segs = trip.segments, acts = [];
  segs.forEach((s, i) => {
    const st = ms(s.start), en = ms(s.end);
    if (s.type === "flight") {
      const lead = (s.international ? 3 : 2) * H;
      const ck = st - (s.airline.checkinHours || 24) * H;
      acts.push({ k: "checkin", from: ck, to: st - lead - (driveMin(s.from) || 0) * M - 30 * M, s, p: 5 });
      const drive = (driveMin(s.from) || 0) * M;
      acts.push({ k: "airport", from: st - lead - drive - 30 * M, to: st, s, p: 6 });
      acts.push({ k: "inair", from: st, to: en, s, p: 9 });
      acts.push({ k: "bags", from: en, to: en + 40 * M, s, p: 8 });
      const conn = segs[i + 1] && segs[i + 1].type === "flight" && ms(segs[i + 1].start) - en < 5 * H ? segs[i + 1] : null;
      if (conn) acts.push({ k: "connect", from: en + 40 * M, to: ms(conn.start) - 60 * M, s, conn, p: 7 });
      else {
        const targets = segs.slice(i + 1).filter(x => x.type !== "flight" && x.type !== "activity" && ms(x.start) < en + 8 * H && ms(x.end) > en);
        const lodging = segs.find(x => x.type === "lodging" && ms(x.start) < en + 8 * H && ms(x.end) > en);
        if (lodging && !targets.includes(lodging)) targets.push(lodging);
        targets.sort((a, b) => (a.type === "lodging") - (b.type === "lodging"));
        if (targets.length) acts.push({ k: "goto", from: en + 40 * M, to: en + 4 * H, s, targets, p: 7 });
        else if (driveMin(s.to)) acts.push({ k: "gohome", from: en + 40 * M, to: en + 3 * H, s, p: 7 });
      }
    } else if (s.type === "lodging") {
      acts.push({ k: "stay", from: st, to: en, s, p: 1 });
      if (s.onlineCheckin) acts.push({ k: "hotelcheckin", from: st - (s.onlineCheckin.opensHours || 24) * H, to: st + 6 * H, s, p: 4 });
      if (!s.home) acts.push({ k: "checkout", from: en - 4 * H, to: en, s, p: 4 });
    } else if (s.type === "car" || s.type === "transfer") {
      acts.push({ k: "pickup", from: st - 90 * M, to: st + 60 * M, s, p: 6 });
      if (s.type === "car") acts.push({ k: "return", from: en - 3 * H, to: en, s, p: 4 });
    } else if (s.type === "activity") {
      acts.push({ k: "activity", from: st - 2 * H, to: Math.min(en, st + 4 * H), s, p: 3 });
    }
  });
  return acts;
}

function actionCard(a, t) {
  const s = a.s;
  let eyebrow = "", title = "", sub = "", body = "";
  if (a.k === "checkin") {
    const opened = ms(s.start) - (s.airline.checkinHours || 24) * H;
    eyebrow = "Check-in is open";
    title = `Check in for ${esc(s.flightNumber)} to ${esc(city(s))}`;
    sub = `Departs ${DT(s.start)} from ${esc(apName(s.from))} (${esc(s.from)}). Arrives ${arrives(s)}. Check-in opened ${when(opened, s.start)}.`;
    body = `<div class="btns">${link(s.airline.checkin, `Check in on ${s.airline.name}`, true)}${link(status(s), "Flight status")}</div>
      <dl class="kv">${codeRow("Confirmation", s.confirmation)}${row("Cabin", esc(s.cabin))}</dl>${paxList(s.travelers)}${notes(s.notes)}`;
  } else if (a.k === "airport") {
    const lead = (s.international ? 3 : 2);
    eyebrow = "Time to go";
    const dm = driveMin(s.from);
    const tg = termGate(s.departure);
    title = (dm ? `Leave home by ${timeAt(ms(s.start) - lead * H - dm * M, s.start)} for ${esc(apName(s.from))} airport` : `Head to ${esc(apName(s.from))} airport`) + (s.departure?.terminal ? `, ${esc(s.departure.terminal.split(",")[0])}` : "");
    sub = `${esc(s.flightNumber)} departs ${T(s.start)} and arrives ${arrives(s)}. Aim to be there ${lead} hours early${s.international ? " for an international flight" : ""}${dm ? `; the drive from ${esc(HOME.address)} is about ${dm} min` : ""}.${tg ? ` Departs from ${esc(tg)}.` : ""}${s.departure?.gate ? "" : " Gate not posted yet."}`;
    body = `<div class="btns">${link(dm ? directions(HOME.address, depPlace(s)) : maps(depPlace(s)), dm ? "Directions from home" : "Map to airport", true)}${link(s.airline.checkin, "Boarding pass")}${link(status(s), "Gate & status")}</div>
      ${s.departure?.checkin ? `<p class="note">• ${esc(s.departure.checkin)}</p>` : ""}<dl class="kv">${codeRow("Confirmation", s.confirmation)}</dl>${paxList(s.travelers)}${notes(s.notes)}`;
  } else if (a.k === "gohome") {
    eyebrow = "Welcome back";
    title = "Head home";
    sub = `About ${driveMin(s.to)} min from ${esc(apName(s.to))} to ${esc(HOME.address)}.`;
    body = `<ul class="steps"><li><b>Baggage claim</b>${esc(s.arrival?.bags || "Follow signs to baggage claim.")}</li></ul><div class="btns">${link(directions(arrPlace(s), HOME.address), "Directions home", true)}</div>`;
  } else if (a.k === "inair") {
    eyebrow = "In the air";
    title = `${esc(s.flightNumber)} to ${esc(city(s))}`;
    sub = `Lands ${arrives(s)}, ${rel(ms(s.end) - now())}.`;
    body = `<div class="btns">${link(status(s), "Live flight status", true)}</div>${paxList(s.travelers)}`;
  } else if (a.k === "bags") {
    eyebrow = "You've landed";
    title = `Welcome to ${esc(city(s))}. Pick up your bags`;
    sub = `${esc(s.flightNumber)} landed ${T(s.end)}${termGate(s.arrival) ? ` at ${esc(termGate(s.arrival))}` : ""}.`;
    body = `<ul class="steps"><li><b>Baggage claim</b>${esc(s.arrival?.bags || "Follow signs to baggage claim.")}</li>${(s.arrival?.ground || []).map(g => `<li>${esc(g)}</li>`).join("")}</ul>
      <div class="btns">${link(status(s), "Carousel & status", true)}</div>`;
  } else if (a.k === "connect") {
    eyebrow = "Connection";
    title = `Make your connection to ${esc(a.conn.flightNumber)}`;
    sub = `Departs ${T(a.conn.start)} to ${esc(apName(a.conn.to))}${termGate(a.conn.departure) ? ` from ${esc(termGate(a.conn.departure))}` : ""}. You have ${rel(ms(a.conn.start) - now()).replace("in ", "")} left.`;
    body = `<ul class="steps"><li>${esc(s.arrival?.bags || "")}</li></ul>
      <div class="btns">${link(a.conn.airline.checkin, `Check in on ${a.conn.airline.name}`, true)}${link(status(a.conn), "Gate & status")}</div>
      <dl class="kv">${codeRow("Confirmation", a.conn.confirmation)}</dl>${paxList(a.conn.travelers)}`;
  } else if (a.k === "goto") {
    const tgt = a.targets[0], lodging = a.targets.find(x => x.type === "lodging");
    eyebrow = "Next step";
    if (tgt.type === "lodging" && tgt.home) {
      title = `Head to ${esc(tgt.title)}`;
      sub = esc(tgt.address);
    } else if (tgt.type === "lodging") {
      title = `Get to ${esc(tgt.title)}`;
      const early = now() < ms(tgt.start);
      sub = early ? `You'll arrive early: check-in starts ${T(tgt.start)}. Ask the front desk to hold your bags.`
                  : `Check-in has been open since ${T(tgt.start)}, so you can go straight to your room.`;
    } else {
      title = tgt.type === "transfer" ? `Meet your driver: ${esc(tgt.title)}` : `Pick up your car: ${esc(tgt.title)}`;
      sub = `${tgt.type === "transfer" ? "Pickup" : "Pickup"} ${T(tgt.start)}${lodging ? `, then on to ${esc(lodging.title)}` : ""}.`;
    }
    body = `<ul class="steps">${(s.arrival?.ground || []).map(g => `<li>${esc(g)}</li>`).join("")}</ul>
      <div class="btns">${link(directions(arrPlace(s), (lodging || tgt).address || (lodging || tgt).title), "Directions", true)}</div>
      <dl class="kv">${a.targets.map(x => codeRow(x.title, x.confirmation)).join("")}</dl>
      ${a.targets.flatMap(x => x.notes || []).map(n => `<div class="flag">${esc(n)}</div>`).join("")}`;
  } else if (a.k === "checkout") {
    eyebrow = "Today";
    title = `Check out of ${esc(s.title)} by ${T(s.end)}`;
    sub = `${rel(ms(s.end) - now())}.`;
    body = `<dl class="kv">${codeRow("Confirmation", s.confirmation)}${row("Phone", esc(s.phone))}</dl>`;
  } else if (a.k === "hotelcheckin") {
    eyebrow = "Hotel check-in";
    title = `Check in online for ${esc(s.title)}`;
    sub = `Rooms are ready from ${DT(s.start)}. ${esc(s.onlineCheckin.note || "")}`;
    body = `<div class="btns">${link(s.onlineCheckin.url, s.onlineCheckin.label, true)}${link(maps(s.address), "Map")}</div><dl class="kv">${codeRow("Confirmation", s.confirmation)}</dl>`;
  } else if (a.k === "stay") {
    eyebrow = "Where you are";
    title = `Staying at ${esc(s.title)}`;
    sub = s.home ? `Until ${DD(s.end)}.` : `Check-out ${DT(s.end)}.`;
  } else if (a.k === "pickup") {
    eyebrow = s.type === "transfer" ? "Transfer" : "Rental car";
    title = esc(s.title);
    sub = `${s.type === "transfer" ? "Pickup" : "Pick up"} ${DT(s.start)} at ${esc(s.address || "")}.`;
    body = `<dl class="kv">${codeRow("Confirmation", s.confirmation)}${row("Phone", esc(s.phone))}</dl>${(s.details || []).map(d => `<p class="note">• ${esc(d)}</p>`).join("")}${(s.notes || []).map(n => `<div class="flag">${esc(n)}</div>`).join("")}<div class="btns">${link(s.link, "Manage booking")}</div>`;
  } else if (a.k === "return") {
    eyebrow = "Rental car";
    title = `Return ${esc(s.title)}`;
    sub = `Due ${DT(s.end)}.`;
  } else if (a.k === "activity") {
    eyebrow = "Plans";
    title = esc(s.title);
    sub = `${DT(s.start)}${s.address ? ` · ${esc(s.address)}` : ""}`;
    body = `<div class="btns">${s.address ? link(maps(s.address), "Map", true) : ""}${link(s.link, "Website")}</div><dl class="kv">${codeRow("Booking", s.confirmation)}</dl>`;
  }
  return { eyebrow, title, sub, body };
}

function flightNowCard(f) {
  const dm = driveMin(f.from), lead = f.international ? 3 : 2;
  const fromHome = dm ? `<div class="flag ok">Leave ${esc(HOME.address)} by ${timeAt(ms(f.start) - lead * H - dm * M, f.start)} on ${DD(f.start)}: about ${dm} min to ${esc(apName(f.from))} and ${lead} h at the airport.</div>
    <div class="btns">${link(directions(HOME.address, depPlace(f)), "Directions to the airport", true)}</div>` : "";
  return `<section class="card" aria-label="Your next flight"><div class="eyebrow">Your next flight</div>${fromHome}${segBlock(f)}</section>`;
}

function lodgingCard(s, label) {
  return `<section class="card" aria-label="${esc(label)}">
    <div class="eyebrow">${esc(label)}</div>
    <h3>${esc(s.title)}</h3>
    <dl class="kv">
      ${row("Address", `${esc(s.address)}${copyBtn(s.address)}`)}
      ${s.home ? "" : row("Check-in", DT(s.start)) + row("Check-out", DT(s.end))}
      ${codeRow("Confirmation", s.confirmation)}${row("Phone", s.phone ? `<span class="code">${esc(s.phone)}</span>${copyBtn(s.phone)}` : "")}
    </dl>
    ${(s.details || []).map(d => `<p class="note">• ${esc(d)}</p>`).join("")}
    ${s.onlineCheckin ? `<p class="note">${esc(s.onlineCheckin.note || "")}</p>` : ""}<div class="btns">${s.onlineCheckin ? link(s.onlineCheckin.url, s.onlineCheckin.label, true) : ""}${link(maps(s.address), "Open in Maps", !s.onlineCheckin)}${link(s.link, "Manage booking")}</div>
  </section>`;
}

function segLabel(s) {
  if (s.type === "flight") return `${s.flightNumber} ${s.from} → ${s.to}`;
  if (s.type === "lodging") return `Check in: ${s.title}`;
  return s.title;
}

function renderNow() {
  const t0 = now();
  const active = tripsFor(state.person).filter(t => ms(t.start) - 3 * D <= t0 && t0 <= ms(t.end) + 12 * H);
  let html = previewControls();
  if (!active.length) {
    const next = tripsFor(state.person).find(t => ms(t.start) > t0);
    if (!next) return html + `<div class="empty">No upcoming trips.</div>`;
    const firstAct = actionsFor(next).filter(a => a.k !== "stay").sort((a, b) => a.from - b.from)[0];
    html += `<section class="hero"><div class="hero-head calm"><div class="eyebrow">No trip right now</div>
      <h2>Next: ${esc(next.title)}</h2><p class="sub">${rangeStr(next.start, next.end)} · starts ${rel(ms(next.start) - t0)}</p></div>
      <div class="hero-body">${firstAct ? `<p class="note">First thing to do: <b>${esc(actionCard(firstAct, next).title.replace(/<[^>]+>/g, ""))}</b> from ${when(firstAct.from, firstAct.s.start)}.</p>` : ""}
      ${(next.watch || []).map(w => `<div class="flag">${esc(w)}</div>`).join("")}</div></section>`;
    return html;
  }
  for (const trip of active) {
    const acts = actionsFor(trip);
    const live = acts.filter(a => a.from <= t0 && t0 < a.to).sort((a, b) => b.p - a.p);
    let primary = live[0];
    const upcoming = acts.filter(a => a.from > t0 && a.k !== "stay").sort((a, b) => a.from - b.from);
    let head;
    if (primary) {
      const c = actionCard(primary, trip);
      head = `<section class="hero"><div class="hero-head${primary.k === "stay" ? " calm" : ""}"><div class="eyebrow">${esc(trip.title)} · ${c.eyebrow}</div><h2>${c.title}</h2><p class="sub">${c.sub}</p></div>
        ${c.body ? `<div class="hero-body">${c.body}</div>` : ""}</section>`;
      const others = live.slice(1).filter(a => a.k !== "stay" && !(a.k === "checkout" && primary.k === "stay"));
      for (const o of others) {
        const c2 = actionCard(o, trip);
        head += `<section class="hero"><div class="hero-head calm"><div class="eyebrow">Also now · ${c2.eyebrow}</div><h2>${c2.title}</h2><p class="sub">${c2.sub}</p></div>${c2.body ? `<div class="hero-body">${c2.body}</div>` : ""}</section>`;
      }
    } else {
      const n = upcoming[0];
      const c = n ? actionCard(n, trip) : null;
      head = `<section class="hero"><div class="hero-head calm"><div class="eyebrow">${esc(trip.title)}</div>
        <h2>${n ? `Coming up ${rel(n.from - t0)}` : "Trip wrapping up"}</h2><p class="sub">${n ? `${c.title.replace(/<[^>]+>/g, "")} · ${when(n.from, n.s.start)}` : "Nothing else scheduled."}</p></div></section>`;
    }
    html += head;
    // Prefer the lodging booked for the selected person (e.g. a companion's own room).
    const lodgings = trip.segments.filter(s => s.type === "lodging");
    const mine = lodgings.filter(s => (s.travelers || []).includes(state.person));
    const pool = mine.length ? mine : lodgings;
    const stayNow = pool.find(s => ms(s.start) - 8 * H <= t0 && t0 < ms(s.end));
    const stayNext = pool.find(s => ms(s.start) > t0);
    const st = stayNow || stayNext;
    // Until you've landed, the next flight matters more than the hotel at the other end.
    const nextFlight = trip.segments.find(s => s.type === "flight" && ms(s.end) > t0);
    const flyFirst = nextFlight && (!st || ms(nextFlight.end) <= ms(st.start) + 24 * H);
    if (flyFirst) html += flightNowCard(nextFlight);
    else if (st) html += lodgingCard(st, stayNow ? "Where you're staying" : "Where you're staying next");
    const nextSegs = trip.segments.filter(s => ms(s.start) > t0).slice(0, 5);
    if (nextSegs.length) html += `<section class="card"><div class="eyebrow">Next in this trip</div><ul class="next">
      ${nextSegs.map(s => `<li><span class="when">${DD(s.start)}<br>${T(s.start)}</span><span><b>${esc(segLabel(s))}</b>${s.type === "flight" ? `<br><span class="muted">Arrives ${arrives(s)}</span>` : ""}${s.confirmation ? `<br><span class="muted code">${esc(s.confirmation)}</span>` : ""}${quickBtn(s) ? `<br>${quickBtn(s)}` : ""}</span></li>`).join("")}</ul></section>`;
    if ((trip.watch || []).length) html += trip.watch.map(w => `<div class="flag">${esc(w)}</div>`).join("");
  }
  return html;
}

function previewControls() {
  const next = tripsFor(state.person).find(t => ms(t.end) > Date.now());
  const f = next?.segments.find(s => s.type === "flight");
  const chips = f ? [
    ["Live", null],
    ["Day before flight", ms(f.start) - 20 * H],
    ["At the airport", ms(f.start) - 90 * M],
    ["Just landed", ms(f.end) + 15 * M],
    ["1 h after landing", ms(f.end) + 60 * M],
  ] : [["Live", null]];
  return `<div class="preview"><div class="row"><span class="eyebrow">Preview a moment</span>${f ? `<span class="muted">based on ${esc(f.flightNumber)}</span>` : ""}</div>
    <div class="row">${chips.map(([l, v]) => `<button class="chip" data-at="${v ?? ""}" aria-pressed="${(state.override ?? null) === v}">${l}</button>`).join("")}
    <input type="datetime-local" id="at" aria-label="Pick a date and time"></div>
    ${state.override ? `<p class="note">Showing the page as it would look on <b>${when(state.override, f ? f.start : new Date().toISOString())}</b> (${esc(f ? apName(f.from) : "")} time).</p>` : ""}</div>`;
}

function segBlock(s) {
  if (s.type === "flight") {
    const dur = ms(s.end) - ms(s.start), hh = Math.floor(dur / H), mm = Math.round((dur % H) / M);
    return `<div class="seg"><div class="seg-main"><span class="seg-type">Flight · ${esc(s.airline.name)} ${esc(s.flightNumber)}</span>
      <div class="route"><div><div class="ap">${esc(s.from)}</div><div class="t">${DD(s.start)}<br>${T(s.start)}<br><span class="tz">${esc(apName(s.from))} time</span>${termGate(s.departure) ? `<br><span class="tz">${esc(termGate(s.departure))}</span>` : ""}</div></div>
      <div class="mid">${hh}h ${mm}m<br>✈</div>
      <div class="r"><div class="ap">${esc(s.to)}</div><div class="t">${DD(s.end)}<br><b>Arrives ${T(s.end)}</b><br><span class="tz">${esc(apName(s.to))} time</span>${termGate(s.arrival) ? `<br><span class="tz">${esc(termGate(s.arrival))}</span>` : ""}</div></div></div></div>
      <div class="stub"><dl class="kv">${codeRow("Confirmation", s.confirmation)}${row("Cabin", esc(s.cabin))}</dl>${paxList(s.travelers)}${s.departure?.checkin ? `<p class="note">• ${esc(s.departure.checkin)}</p>` : ""}${notes(s.notes)}
      <div class="btns">${link(s.airline.checkin, "Check in", true)}${link(s.airline.manage, `Manage on ${s.airline.name}`)}${link(status(s), "Status")}</div></div></div>`;
  }
  const label = { lodging: "Stay", car: "Rental car", transfer: "Transfer", activity: "Activity" }[s.type] || s.type;
  return `<div class="seg"><div class="seg-main"><span class="seg-type">${label}</span><h4>${esc(s.title)}</h4>
    <dl class="kv">${row(s.home ? "Arrive" : s.type === "lodging" ? "Check-in" : "Starts", DT(s.start))}${row(s.home ? "Leave" : s.type === "lodging" ? "Check-out" : "Ends", DT(s.end))}
    ${s.address ? row("Address", `${esc(s.address)}${copyBtn(s.address)}`) : ""}${codeRow("Confirmation", s.confirmation)}${row("Phone", s.phone ? `<span class="code">${esc(s.phone)}</span>` : "")}</dl>
    ${(s.details || []).map(d => `<p class="note">• ${esc(d)}</p>`).join("")}${(s.notes || []).map(n => `<div class="flag">${esc(n)}</div>`).join("")}
    <div class="btns">${s.onlineCheckin ? link(s.onlineCheckin.url, s.onlineCheckin.label, true) : ""}${s.address ? link(maps(s.address), "Map") : ""}${link(s.link, "Manage booking")}</div></div></div>`;
}

// "Leave Mon, Oct 19, 1:00 PM (SJC) · Back Fri, Oct 23, 1:11 PM (SJC)" from the first and last flights
function tripEnds(t) {
  const fl = t.segments.filter(x => x.type === "flight");
  const out = fl[0], back = fl.length > 1 ? fl[fl.length - 1] : null;
  const leave = out ? `${DD(out.start)} (${esc(out.from)})` : DD(t.start);
  const end = back ? ["Back", `${DD(back.end)} (${esc(back.to)})`] : out ? ["Arrive", `${DD(out.end)} (${esc(out.to)})`] : ["Until", DD(t.end)];
  return `<div class="ends"><span><b>Leave</b> ${leave}</span><span><b>${end[0]}</b> ${end[1]}</span></div>`;
}

function quickRow(t) {
  const items = t.segments.filter(x => checkinLink(x) && ms(x.end) > Date.now());
  if (!items.length) return "";
  const label = x => x.type === "flight" ? `✈ ${x.flightNumber.split(" ")[0]} · ${DD(x.start).split(", ")[1]}` : `Hotel · ${DD(x.start).split(", ")[1]}`;
  return `<div class="quick"><span class="eyebrow">Check in</span>${items.map(x => `<a class="btn mini" ${hrefAttrs(checkinLink(x))}>${esc(label(x))} ↗</a>`).join("")}</div>`;
}

function renderTrips(past) {
  const t0 = Date.now();
  const list = tripsFor(state.person).filter(t => past ? ms(t.end) < t0 : ms(t.end) >= t0);
  if (past) list.reverse();
  if (!list.length) return `<div class="empty">${past ? "No past trips yet. Trips move here after they end." : "No upcoming trips."}</div>`;
  let html = "", lastMonth = "";
  list.forEach((t, i) => {
    const p = parts(ms(t.start), offMin(t.start)), mk = `${MO[p.mo]} ${p.y}`;
    if (mk !== lastMonth) { html += `<div class="month">${["January","February","March","April","May","June","July","August","September","October","November","December"][p.mo]} ${p.y}</div>`; lastMonth = mk; }
    const soon = !past && ms(t.start) - t0 < 7 * D;
    html += `<details class="trip"><summary>
      <div class="trip-top"><h3>${esc(t.title)}</h3><span class="chev" aria-hidden="true">›</span></div>
      <div class="muted">${esc(t.place)}</div>
      <div class="chips">${soon ? `<span class="chip soon">${ms(t.start) > t0 ? "Starts " + rel(ms(t.start) - t0) : "Happening now"}</span>` : ""}${!peopleOf(t).has(MAIN) ? `<span class="chip fam">${first(MAIN)} isn't on this trip</span>` : ""}
        ${t.travelers.map(n => `<span class="chip">${first(n)}</span>`).join("")}${(t.companions || []).map(n => `<span class="chip">+ ${first(n)}</span>`).join("")}</div>
      ${tripEnds(t)}
      </summary><div class="trip-body">${quickRow(t)}${(t.watch || []).map(w => `<div class="flag">${esc(w)}</div>`).join("")}${t.segments.map(segBlock).join("")}</div></details>`;
  });
  return html;
}

function renderBanner() {
  const s = state.status;
  if (!s) return "";
  const alerts = (s.alerts || []).filter(a => !a.dismissed);
  const checked = s.lastChecked ? `Last checked ${rel(Date.parse(s.lastChecked) - Date.now())}.` : "";
  const about = document.getElementById("about-checked"); if (about) about.textContent = checked;
  if (alerts.length) return `<div class="banner alert"><strong>${alerts.length} change${alerts.length > 1 ? "s" : ""} found</strong>${alerts.map(a => `<span>${esc(a.date ? a.date + ": " : "")}${esc(a.text)}</span>`).join("")}</div>`;
  return "";
}

function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === state.view)));
  const app = document.getElementById("app");
  document.querySelector(".who").hidden = state.locked || !state.loaded;
  document.querySelector(".tabs").hidden = state.locked;
  if (state.locked) {
    app.innerHTML = `<form class="card" id="unlock" autocomplete="on"><div class="eyebrow">Private</div><h3>Enter the family passphrase</h3>
      <p class="note">Trips are encrypted. You only need to do this once on this device.</p>
      <input id="pass" type="password" autocomplete="current-password" aria-label="Passphrase" style="font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">
      ${state.unlockError ? `<div class="flag">${esc(state.unlockError)}</div>` : ""}
      <div class="btns"><button class="btn primary" type="submit">Unlock</button></div></form>`;
    return;
  }
  if (state.error) { app.innerHTML = `<div class="empty">${esc(state.error)}</div>`; return; }
  if (!state.loaded) { app.innerHTML = `<div class="empty">Loading trips…</div>`; return; }
  if (!state.trips.length) { app.innerHTML = `<div class="empty">No trips loaded yet. They'll appear here once they're added.</div>`; return; }
  const people = allPeople();
  if (!people.includes(state.person)) state.person = MAIN;
  const sel = document.getElementById("person");
  const opts = people.map(p => `<option value="${esc(p)}"${p === state.person ? " selected" : ""}>${esc(p)}${p === MAIN ? " (me)" : ""} · ${tripsFor(p).filter(t => ms(t.end) >= Date.now()).length} upcoming</option>`).join("");
  if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
  sel.value = state.person;
  const body = state.view === "now" ? renderNow() : renderTrips(state.view === "past");
  app.innerHTML = renderBanner() + body;
}

function tick() {
  const c = document.getElementById("clock");
  const d = new Date();
  c.textContent = d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { state.view = tab.dataset.view; try { localStorage.setItem("tb-view", state.view); } catch (_) {} render(); window.scrollTo(0, 0); return; }
  const cp = e.target.closest(".copy");
  if (cp) {
    const v = cp.dataset.copy;
    const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1500); };
    try { navigator.clipboard.writeText(v).then(done, () => selectText(cp)); } catch (_) { selectText(cp); }
    return;
  }
  const chip = e.target.closest(".preview .chip");
  if (chip) { state.override = chip.dataset.at ? +chip.dataset.at : null; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "person") {
    state.person = e.target.value; state.override = null;
    render(); return;
  }
  if (e.target.id === "at" && e.target.value) { state.override = new Date(e.target.value).getTime(); render(); }
});
function selectText(btn) {
  const span = btn.previousElementSibling || btn.parentElement;
  const r = document.createRange(); r.selectNodeContents(span);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

tick(); setInterval(() => { tick(); if (!state.override && state.view === "now") render(); }, 60e3);
render();

// ---------- encrypted data: AES-GCM, key from PBKDF2(passphrase) ----------
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
let blob = null;
async function decrypt(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.salt), iterations: blob.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function apply(data) {
  MAIN = data.main; HOME = data.home || null;
  if (!state.person) state.person = MAIN;
  state.trips = (data.trips || []).sort((a, b) => ms(a.start) - ms(b.start));
  state.status = data.status || null;
  state.loaded = true; state.locked = false;
  document.getElementById("lock").hidden = false;
}
async function tryUnlock(pass, remember) {
  try {
    apply(await decrypt(pass));
    if (remember) { try { localStorage.setItem("tb-pass", pass); } catch (_) {} }
    render(); return true;
  } catch (e) { return false; }
}
async function load() {
  try {
    const r = await fetch("trips.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    blob = await r.json();
  } catch (e) {
    state.error = "Couldn't load trips. Check your connection and reopen the app."; render(); return;
  }
  let saved = null; try { saved = localStorage.getItem("tb-pass"); } catch (_) {}
  if (saved && await tryUnlock(saved, false)) return;
  state.locked = true; render();
  setTimeout(() => document.getElementById("pass")?.focus(), 50);
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "unlock") return;
  e.preventDefault();
  const pass = document.getElementById("pass").value.trim();
  if (!(await tryUnlock(pass, true))) { state.unlockError = "That passphrase didn't work. Check spelling and dashes."; render(); }
});
document.getElementById("lock").addEventListener("click", () => {
  try { localStorage.removeItem("tb-pass"); } catch (_) {}
  location.reload();
});
load();
// refresh data when the app comes back to the foreground
document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.locked && blob) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
